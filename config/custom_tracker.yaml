# Custom ByteTrack Configuration for Exam Hall
# Optimized for higher recall in low-movement, high-occlusion environments

tracker_type: bytetrack # (str) Tracker backend: bytetrack
track_high_thresh: 0.25 # (float) First-stage match threshold; lower to keep more
track_low_thresh: 0.1 # (float) Second-stage threshold for low-score matches; balances recovery vs drift
new_track_thresh: 0.25 # (float) Start a new track if no match >= this
track_buffer: 60 # (int) Frames to keep lost tracks alive (2 seconds at 30 FPS)
match_thresh: 0.8 # (float) Association similarity threshold (IoU/cost)
fuse_score: True # (bool) Fuse detection score with motion/IoU for matching
